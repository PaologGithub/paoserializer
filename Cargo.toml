[package]
name = "paoserializer"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.1"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
zstd-safe = "8.0.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
default = ["std"]
std = ["serde/std", "postcard/use-std", "zstd-safe/std", "crc32fast/std"]

[[bench]]
name = "bench"
harness = false
