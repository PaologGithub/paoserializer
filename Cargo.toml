[package]
name = "paoserializer"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.1"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
zstd = "0.14.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false