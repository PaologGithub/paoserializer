[package]
name = "paoserializer"
version = "0.1.0"
edition = "2024"
description = "Paolog's rust binary serializer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PaologGithub/paoserializer"
readme = "README.md"
keywords = ["serialization", "no-std", "serde", "postcard", "zstd"]
categories = ["no-std", "encoding"]

[dependencies]
crc32fast = { version = "1.5.1", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
zstd-safe = { version = "8.0.0", default-features = false}

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
default = ["std"]
std = ["serde/std", "postcard/use-std", "zstd-safe/std", "crc32fast/std"]

[[bench]]
name = "bench"
harness = false
